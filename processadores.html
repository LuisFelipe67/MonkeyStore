<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processadores | Monkey Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="loja.css">
</head>
<body>
  <p class="crumb"><a href="categorias.html">Categorias</a> &gt; <a href="processadores.html">Processadores</a></p>

  <section class="banner">
    <div>
      <h1>Processadores</h1>
      <p class="banner__sub">Desempenho de ponta para seu setup</p>
      <p class="banner__txt">Escolha entre as melhores marcas do mercado, com alta performance para jogos, trabalho e muito mais.</p>
    </div>
  </section>

  <main class="lista">
    <aside class="filtros-wrap">
      <h2 class="filtros-titulo" id="ico-filtro"> Filtros</h2>
      <form class="filtros" id="filtros">
        <fieldset>
          <legend>Preço</legend>
          <div class="minmax">
            <input type="number" id="min" min="0" placeholder="Mínimo" aria-label="Preço mínimo">
            <span>—</span>
            <input type="number" id="max" min="0" placeholder="Máximo" aria-label="Preço máximo">
          </div>
          <label><input type="checkbox" name="faixa" value="0"> Até R$ 1000</label>
          <label><input type="checkbox" name="faixa" value="1"> R$ 1000 - R$ 2000</label>
          <label><input type="checkbox" name="faixa" value="2"> R$ 2000 - R$ 4000</label>
          <label><input type="checkbox" name="faixa" value="3"> Acima de R$ 4000</label>
        </fieldset>
        <fieldset id="f-marca"><legend>Marca</legend></fieldset>
        <fieldset id="f-geracao"><legend>Geração</legend></fieldset>
        <button type="reset" class="limpar">Limpar filtros</button>
      </form>
    </aside>

    <section>
      <div class="barra">
        <label>Ordenar por:
          <select id="ordem">
            <option value="pop">Mais populares</option>
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
            <option value="nome">Nome (A–Z)</option>
          </select>
        </label>
        <span id="contagem"></span>
      </div>
      <div class="grade" id="grade"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="listagem.js"></script>
</body>
</html>
